<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEI — Galeria de Ações e Registros</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { width: 100%; margin: 0; padding: 0; overflow-x: hidden; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

    .hero-layer {
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1), transform 7s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }

    .photo-card {
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease, border-color 0.25s ease;
    }
    .photo-card:hover { transform: translateY(-4px); }
    .photo-card img {
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    .photo-card:hover img { transform: scale(1.04); }

    #lightbox {
      transition: opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #lbImagemWrapper {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      will-change: transform, opacity;
    }
    #lbBgBlur {
      transition: background-image 0.5s ease-in-out;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 px-3 py-4 md:px-6 md:py-5">

  <div class="w-full max-w-[1800px] mx-auto">

    <!-- BARRA SUPERIOR -->
    <div class="mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <span class="text-[11px] font-bold uppercase tracking-widest text-blue-600 dark:text-blue-400">Memória Institucional • DEI SEMEC</span>
        <h1 class="text-xl md:text-3xl font-extrabold tracking-tight">Galeria de Ações & Registros</h1>
      </div>

      <div class="flex items-center gap-2">
        <div class="relative flex-1 sm:w-72">
          <input type="text" id="campoBusca" oninput="aplicarFiltros()" placeholder="Buscar evento ou legenda..."
            class="w-full pl-9 pr-3 py-2 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs md:text-sm focus:border-blue-500 outline-none shadow-xs" />
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>

        <button onclick="alternarTema()" title="Alternar Tema"
          class="p-2.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-blue-500 transition cursor-pointer shadow-xs">
          <span id="iconeTema" class="text-sm">🌙</span>
        </button>
      </div>
    </div>

    <!-- HERO CARROSSEL HORIZONTAL -->
    <div id="heroContainer" onclick="abrirLightboxDoHero()"
      class="relative w-full h-[280px] sm:h-[380px] md:h-[460px] rounded-3xl overflow-hidden shadow-xl mb-6 bg-slate-900 cursor-pointer group select-none">
      
      <div id="heroSlides" class="w-full h-full relative"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/20 to-transparent pointer-events-none"></div>

      <div class="absolute bottom-0 left-0 right-0 p-5 md:p-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div class="max-w-3xl">
          <div class="flex items-center gap-2 mb-1.5">
            <span id="heroAlbum" class="px-3 py-0.5 rounded-full text-[11px] font-bold bg-blue-600/90 backdrop-blur-md text-white uppercase tracking-wide">Sincronizando</span>
            <span id="heroData" class="text-xs text-slate-200 font-medium drop-shadow"></span>
          </div>
          <h2 id="heroTitulo" class="text-lg sm:text-2xl md:text-3xl font-extrabold text-white leading-tight drop-shadow-sm">Carregando fotos do Google Drive...</h2>
          <p id="heroDesc" class="text-xs md:text-sm text-slate-200/90 mt-1 line-clamp-2 max-w-2xl">Conectando ao repositório oficial da DEI.</p>
        </div>

        <div class="flex items-center gap-2.5 self-start md:self-end" onclick="event.stopPropagation()">
          <button onclick="mudarHero(-1)" class="w-10 h-10 rounded-full bg-white/15 hover:bg-white/30 backdrop-blur-xl border border-white/20 text-white flex items-center justify-center transition cursor-pointer">❮</button>
          <button onclick="mudarHero(1)" class="w-10 h-10 rounded-full bg-white/15 hover:bg-white/30 backdrop-blur-xl border border-white/20 text-white flex items-center justify-center transition cursor-pointer">❯</button>
        </div>
      </div>

      <div id="heroDots" class="absolute top-4 right-5 flex gap-1.5" onclick="event.stopPropagation()"></div>
    </div>

    <!-- BARRA DE FILTROS POR ÁLBUM -->
    <div class="mb-5 flex items-center justify-between gap-4">
      <div id="barraAlbuns" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1"></div>
      <span id="contadorFotos" class="text-xs font-semibold text-slate-500 dark:text-slate-400 whitespace-nowrap hidden sm:inline"></span>
    </div>

    <!-- GRADE DE FOTOS HORIZONTAL (16:10) -->
    <div id="gridGaleria" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>

    <!-- ESTADO VAZIO -->
    <div id="estadoVazio" class="hidden max-w-md mx-auto text-center py-16">
      <div class="text-4xl mb-3">📷</div>
      <h3 id="vazioTitulo" class="font-bold text-lg">Nenhuma foto encontrada</h3>
      <p id="vazioDesc" class="text-xs text-slate-500 mt-1">Verifique se há imagens na pasta do Google Drive ou limpe o filtro.</p>
    </div>

  </div>

  <!-- LIGHTBOX HORIZONTAL ESTILO GALERIA DO IPHONE (COM TELA CHEIA REAL) -->
  <div id="lightbox" class="fixed inset-0 z-50 hidden opacity-0 bg-black flex flex-col justify-between overflow-hidden select-none">
    
    <!-- Fundo dinâmico desfocado -->
    <div id="lbBgBlur" class="absolute inset-0 bg-cover bg-center scale-125 blur-3xl opacity-50 pointer-events-none"></div>
    <div class="absolute inset-0 bg-black/40 pointer-events-none"></div>

    <!-- Barra Superior Translúcida -->
    <div class="relative z-20 flex items-center justify-between px-4 py-2.5 md:px-8 md:py-3.5 bg-black/35 backdrop-blur-xl border-b border-white/10 text-white">
      <div class="flex items-center gap-3 min-w-0">
        <span id="lbAlbum" class="px-3 py-1 rounded-full text-xs font-bold bg-blue-600/90 flex-shrink-0">Álbum</span>
        <div class="min-w-0">
          <h3 id="lbTitulo" class="font-bold text-sm md:text-base leading-tight truncate"></h3>
          <p id="lbSubtitulo" class="text-[11px] text-slate-300 truncate"></p>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-shrink-0">
        <span id="lbContador" class="hidden sm:inline text-xs font-medium text-slate-300 mr-2">1 de 10</span>
        <button onclick="alternarTelaCheia()" title="Expandir Tela Cheia"
          class="px-3 py-1.5 rounded-full bg-white/15 hover:bg-white/25 backdrop-blur-md text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer">
          ⛶ <span class="hidden md:inline">Tela Cheia</span>
        </button>
        <a id="lbDownload" href="#" target="_blank" download
          class="px-3 py-1.5 rounded-full bg-white/15 hover:bg-white/25 backdrop-blur-md text-xs font-semibold flex items-center gap-1.5 transition">
          ⬇ <span class="hidden md:inline">Original</span>
        </a>
        <button onclick="fecharLightbox()"
          class="w-9 h-9 rounded-full bg-white/15 hover:bg-rose-600 text-white font-bold flex items-center justify-center transition cursor-pointer">
          ✕
        </button>
      </div>
    </div>

    <!-- Área Central Ampla na Horizontal -->
    <div id="lbTouchArea" class="relative z-10 flex-1 flex items-center justify-center w-full px-2 md:px-16 py-2 overflow-hidden">
      <button onclick="navegarLightbox(-1)"
        class="hidden md:flex absolute left-5 z-20 w-12 h-12 rounded-full bg-white/15 hover:bg-white/30 backdrop-blur-xl border border-white/15 text-white text-xl items-center justify-center transition cursor-pointer">
        ❮
      </button>

      <div id="lbImagemWrapper" class="w-full h-full flex items-center justify-center">
        <img id="lbImagem" src="" alt=""
          class="max-h-[72vh] md:max-h-[76vh] max-w-[96vw] md:max-w-[88vw] rounded-2xl shadow-[0_25px_70px_rgba(0,0,0,0.8)] object-contain" />
      </div>

      <button onclick="navegarLightbox(1)"
        class="hidden md:flex absolute right-5 z-20 w-12 h-12 rounded-full bg-white/15 hover:bg-white/30 backdrop-blur-xl border border-white/15 text-white text-xl items-center justify-center transition cursor-pointer">
        ❯
      </button>
    </div>

    <!-- Rodapé Estilo iPhone: Legenda + Filmstrip -->
    <div class="relative z-20 bg-black/45 backdrop-blur-2xl border-t border-white/10 pt-2 pb-3 px-4">
      <p id="lbDesc" class="text-center text-xs text-slate-200 max-w-4xl mx-auto mb-2 truncate"></p>
      <div id="lbFilmstrip" class="flex items-center justify-start md:justify-center gap-2 overflow-x-auto no-scrollbar py-1 px-2"></div>
    </div>

  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxTgzWXFQh7BYQAGZg0kA8BKSPSRnd1U7cVV36Fw7EuepMGIcYvzgFnkUJdzGTquCic7g/exec';

    let todasFotos = [];
    let fotosFiltradas = [];
    let albumAtual = 'TODOS';
    let heroIndex = 0;
    let heroTimer = null;
    let lightboxIndex = 0;

    async function iniciarGaleria() {
      try {
        const resp = await fetch(API_URL);
        const dados = await resp.json();

        if (dados.status === 'ok' && Array.isArray(dados.fotos) && dados.fotos.length > 0) {
          todasFotos = dados.fotos;
          renderizarTudo();
        } else {
          mostrarAvisoVazio(
            'Nenhuma imagem encontrada na pasta do Drive',
            'Adicione arquivos JPG, PNG ou WEBP na pasta vinculada e atualize esta página.'
          );
        }
      } catch (e) {
        console.error('Erro ao carregar fotos do Drive:', e);
        mostrarAvisoVazio(
          'Erro de conexão com o Google Drive',
          'Verifique se a implantação do Apps Script está publicada como "Qualquer pessoa".'
        );
      }
    }

    function mostrarAvisoVazio(titulo, desc) {
      document.getElementById('heroAlbum').textContent = 'Aviso';
      document.getElementById('heroTitulo').textContent = titulo;
      document.getElementById('heroDesc').textContent = desc;
      document.getElementById('vazioTitulo').textContent = titulo;
      document.getElementById('vazioDesc').textContent = desc;
      document.getElementById('estadoVazio').classList.remove('hidden');
    }

    function renderizarTudo() {
      gerarBotoesAlbuns();
      iniciarHero(todasFotos.slice(0, 6));
      aplicarFiltros();
    }

    function iniciarHero(destaques) {
      if (!destaques.length) return;
      const container = document.getElementById('heroSlides');
      const dots = document.getElementById('heroDots');

      container.innerHTML = destaques.map((f, i) => `
        <div class="hero-layer absolute inset-0 w-full h-full ${i === 0 ? 'opacity-100 scale-100' : 'opacity-0 scale-105'}">
          <img src="${f.url}" alt="" class="absolute inset-0 w-full h-full object-cover blur-2xl scale-110 opacity-50" />
          <img src="${f.url}" alt="${f
